<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LGS VR Math Learning - WebAR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 30px;
        }

        .question-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .vr-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .question-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.2em;
            line-height: 1.6;
            color: #333;
            margin-bottom: 20px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            padding: 15px 20px;
            background: #ffffff;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #333;
            font-weight: 500;
        }

        .option-btn:hover:not(:disabled) {
            border-color: #764ba2;
            background: #f0f4ff;
            transform: translateX(5px);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .option-btn.correct {
            background: #28a745 !important;
            border-color: #1e7e34 !important;
            color: #ffffff !important;
        }

        .option-btn.correct .option-label {
            color: #ffffff !important;
        }

        .option-btn.incorrect {
            background: #dc3545 !important;
            border-color: #c82333 !important;
            color: #ffffff !important;
        }

        .option-btn.incorrect .option-label {
            color: #ffffff !important;
        }

        .option-label {
            font-weight: bold;
            color: #667eea;
            min-width: 30px;
            font-size: 1.1em;
        }

        .option-text {
            flex: 1;
            color: #333;
        }

        .option-btn.correct .option-text,
        .option-btn.incorrect .option-text {
            color: #ffffff !important;
        }

        button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-message {
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: 600;
            text-align: center;
            font-size: 1.1em;
        }

        .result-message.correct {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .result-message.incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .vr-status {
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            font-weight: 600;
        }

        .vr-status.active {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .vr-status.inactive {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .vr-canvas-container {
            width: 100%;
            height: 400px;
            min-height: 400px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            position: relative;
        }

        #vr-canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .info-box .info-label {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 5px;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 LGS VR Math Learning</h1>
            <p>Akıllı Öğrenme Sistemi - AR/VR Entegrasyonu</p>
        </div>

        <div class="content">
            <!-- Question Panel -->
            <div class="question-panel">
                <div class="panel-title">📝 Soru</div>
                
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Soru yükleniyor...</p>
                </div>

                <div id="question-container" style="display: none;">
                    <div class="filter-group" style="margin-bottom: 20px;">
                        <label for="gorsel-filter" style="font-weight: 600; color: #333; margin-bottom: 8px; display: block;">
                            Görsel Bağımlılık Filtresi:
                        </label>
                        <select id="gorsel-filter" style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; background: white; cursor: pointer;">
                            <option value="">Tümü</option>
                            <option value="bagimli">Bağımlı</option>
                            <option value="bagimsiz">Bağımsız</option>
                            <option value="destekleyici">Destekleyici</option>
                        </select>
                    </div>

                    <div class="question-box">
                        <div class="question-text" id="question-text"></div>
                        
                        <div class="options-container" id="options-container"></div>
                        
                        <div id="result-message" class="result-message" style="display: none;"></div>
                    </div>

                    <button id="new-question-btn">
                        🎲 Yeni Soru Üret
                    </button>

                    <div class="info-box" id="prediction-info" style="display: none;">
                        <div class="info-label">Model Tahmini:</div>
                        <div id="prediction-text"></div>
                    </div>
                </div>
            </div>

            <!-- VR Panel -->
            <div class="vr-panel">
                <div class="panel-title">🥽 VR/AR Görselleştirme</div>
                
                <div class="vr-status inactive" id="vr-status">
                    VR Kapalı
                </div>

                <div class="vr-canvas-container">
                    <canvas id="vr-canvas"></canvas>
                </div>

                <button id="start-vr-btn" style="display: none;">
                    🚀 VR'ı Başlat
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
